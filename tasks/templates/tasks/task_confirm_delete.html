{% extends 'tasks/base.html' %}

{% block title %}Eliminar Tarea{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Confirmar Eliminación</h5>
            </div>
            <div class="card-body text-center py-4">
                <p class="fs-5">¿Estás seguro que deseas eliminar la tarea:</p>
                <p class="fw-bold fs-4 text-danger">"{{ task.title }}"</p>
                <p class="text-muted small">Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex justify-content-center gap-3 mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i>Sí, Eliminar
                    </button>
                    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
